name: Code quality

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Biome
        uses: biomejs/setup-biome@v2.7.1
        with:
          version: latest
      - name: Run Biome
        run: biome ci .

  typecheck:
    runs-on: ubuntu-latest
    name: typecheck (${{ matrix.elasticsearch-version }}, ${{ matrix.typescript }})
    strategy:
      fail-fast: false
      matrix:
        elasticsearch-version: ["^8", "^9"]
        typescript: [typescript, typescript-v6]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Elasticsearch ${{ matrix.elasticsearch-version }}
        run: >-
          bun add --dev
          @elastic/elasticsearch@"${{ matrix.elasticsearch-version }}"
          @elastic/transport@"${{ matrix.elasticsearch-version }}"

      - name: Install TypeScript v6
        if: matrix.typescript == 'typescript-v6'
        run: bun add typescript@^6 --dev

      - name: Run typecheck
        run: bun run typecheck -- --extendedDiagnostics
      - name: Run tests
        run: bun test
      - name: Build package
        run: bun run build
